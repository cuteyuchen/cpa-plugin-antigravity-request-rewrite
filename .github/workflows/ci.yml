name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGIN_ID: request-rewrite

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -mod=mod ./...
      - name: Vet
        run: go vet -mod=mod ./...

  build-hosted:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up MSYS2
        if: ${{ matrix.goos == 'windows' }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: mingw-w64-x86_64-toolchain
      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Build on Unix
        if: ${{ matrix.goos != 'windows' }}
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.goos }}_${{ matrix.goarch }}"
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -mod=mod -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X main.pluginVersion=${VERSION}" \
            -o "dist/${{ matrix.goos }}_${{ matrix.goarch }}/${PLUGIN_ID}.${{ matrix.ext }}" .
      - name: Build on Windows
        if: ${{ matrix.goos == 'windows' }}
        shell: msys2 {0}
        run: |
          mkdir -p "dist/${{ matrix.goos }}_${{ matrix.goarch }}"
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -mod=mod -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X main.pluginVersion=${VERSION}" \
            -o "dist/${{ matrix.goos }}_${{ matrix.goarch }}/${PLUGIN_ID}.${{ matrix.ext }}" .
      - name: Package
        shell: bash
        run: |
          go run ./.github/scripts/package-release.go \
            -library "dist/${{ matrix.goos }}_${{ matrix.goarch }}/${PLUGIN_ID}.${{ matrix.ext }}" \
            -archive "dist/${PLUGIN_ID}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" \
            -checksum "dist/${PLUGIN_ID}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/${{ env.PLUGIN_ID }}_*.zip
            dist/${{ env.PLUGIN_ID }}_*.zip.sha256
          compression-level: 0
          if-no-files-found: error

  build-linux:
    name: Build linux/${{ matrix.goarch }} glibc-2.17
    needs: test
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
          - goarch: arm64
            runner: ubuntu-24.04-arm
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          GO_VERSION="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "GO_VERSION=${GO_VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Build against GLIBC 2.17
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
          MANYLINUX_IMAGE: ${{ matrix.manylinux_image }}
        run: |
          set -euo pipefail
          mkdir -p "dist/linux_${GOARCH}"
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e GO_VERSION \
            -e GOARCH \
            -e VERSION \
            "${MANYLINUX_IMAGE}" \
            bash -euo pipefail -c '
              go_archive="go${GO_VERSION}.linux-${GOARCH}.tar.gz"
              curl -fsSL "https://go.dev/dl/${go_archive}" -o "/tmp/${go_archive}"
              rm -rf /usr/local/go
              tar -C /usr/local -xzf "/tmp/${go_archive}"
              export PATH="/usr/local/go/bin:${PATH}"

              CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" \
                go build -mod=mod -trimpath -buildmode=c-shared \
                -ldflags "-s -w -X main.pluginVersion=${VERSION}" \
                -o "dist/linux_${GOARCH}/request-rewrite.so" .

              glibc_versions="$(readelf --version-info "dist/linux_${GOARCH}/request-rewrite.so" |
                sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -Vu)"
              if [[ -n "${glibc_versions}" ]]; then
                printf "GLIBC versions:\n%s\n" "${glibc_versions}"
                max_glibc="$(printf "%s\n" "${glibc_versions}" | sort -V | tail -n 1)"
                if [[ "$(printf "2.17\n%s\n" "${max_glibc}" | sort -V | tail -n 1)" != "2.17" ]]; then
                  printf "linux %s plugin requires GLIBC_%s, expected GLIBC_2.17 or older\n" "${GOARCH}" "${max_glibc}" >&2
                  exit 1
                fi
              fi
            '
      - name: Package
        shell: bash
        run: |
          go run ./.github/scripts/package-release.go \
            -library "dist/linux_${{ matrix.goarch }}/${PLUGIN_ID}.so" \
            -archive "dist/${PLUGIN_ID}_${VERSION}_linux_${{ matrix.goarch }}.zip" \
            -checksum "dist/${PLUGIN_ID}_${VERSION}_linux_${{ matrix.goarch }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.goarch }}
          path: |
            dist/${{ env.PLUGIN_ID }}_*.zip
            dist/${{ env.PLUGIN_ID }}_*.zip.sha256
          compression-level: 0
          if-no-files-found: error

  build-windows-arm64:
    name: Build windows/arm64
    needs: test
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - uses: go-cross/cgo-actions@d0b8f2f2d67923ce9a42d92a7ef0ed1ebd905f0a
        env:
          GOFLAGS: -mod=mod -trimpath -buildmode=c-shared
        with:
          dir: .
          packages: .
          targets: windows-arm64
          out-dir: dist/windows_arm64
          output: request-rewrite.dll
          flags: -ldflags=-s -w
          x-flags: main.pluginVersion=${{ steps.meta.outputs.version }}
      - name: Package
        shell: bash
        run: |
          go run ./.github/scripts/package-release.go \
            -library "dist/windows_arm64/${PLUGIN_ID}.dll" \
            -archive "dist/${PLUGIN_ID}_${VERSION}_windows_arm64.zip" \
            -checksum "dist/${PLUGIN_ID}_${VERSION}_windows_arm64.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: |
            dist/${{ env.PLUGIN_ID }}_*.zip
            dist/${{ env.PLUGIN_ID }}_*.zip.sha256
          compression-level: 0
          if-no-files-found: error

  build-freebsd:
    name: Build freebsd/amd64
    needs: test
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
      - name: Install FreeBSD cross-build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld curl
      - name: Build FreeBSD plugin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/freebsd_amd64
          sysroot_dir="/tmp/freebsd-sysroot"
          rm -rf "${sysroot_dir}"
          mkdir -p "${sysroot_dir}"
          trap 'sudo rm -rf "${sysroot_dir}" /tmp/freebsd-base.txz' EXIT

          urls=(
            "https://download.freebsd.org/releases/amd64/14.4-RELEASE/base.txz"
            "https://archive.freebsd.org/old-releases/amd64/14.4-RELEASE/base.txz"
            "https://archive.freebsd.org/old-releases/amd64/14.3-RELEASE/base.txz"
          )

          downloaded=false
          for url in "${urls[@]}"; do
            echo "Downloading FreeBSD sysroot from ${url}"
            if curl -fsSL --retry 3 --retry-connrefused "${url}" -o /tmp/freebsd-base.txz; then
              downloaded=true
              break
            fi
          done
          if [[ "${downloaded}" != "true" ]]; then
            echo "failed to download FreeBSD base.txz" >&2
            exit 1
          fi

          sudo tar -xf /tmp/freebsd-base.txz -C "${sysroot_dir}"
          rm -f /tmp/freebsd-base.txz

          CGO_ENABLED=1 \
          GOOS=freebsd \
          GOARCH=amd64 \
          CGO_LDFLAGS="-fuse-ld=lld" \
          CC="clang --target=x86_64-unknown-freebsd14 --sysroot=${sysroot_dir}" \
            go build -mod=mod -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X main.pluginVersion=${VERSION}" \
            -o "dist/freebsd_amd64/${PLUGIN_ID}.so" .
      - name: Package
        shell: bash
        run: |
          go run ./.github/scripts/package-release.go \
            -library "dist/freebsd_amd64/${PLUGIN_ID}.so" \
            -archive "dist/${PLUGIN_ID}_${VERSION}_freebsd_amd64.zip" \
            -checksum "dist/${PLUGIN_ID}_${VERSION}_freebsd_amd64.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-amd64
          path: |
            dist/${{ env.PLUGIN_ID }}_*.zip
            dist/${{ env.PLUGIN_ID }}_*.zip.sha256
          compression-level: 0
          if-no-files-found: error

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - build-hosted
      - build-linux
      - build-windows-arm64
      - build-freebsd
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Verify release set
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          expected=(
            "${PLUGIN_ID}_${VERSION}_linux_amd64.zip"
            "${PLUGIN_ID}_${VERSION}_linux_arm64.zip"
            "${PLUGIN_ID}_${VERSION}_darwin_amd64.zip"
            "${PLUGIN_ID}_${VERSION}_darwin_arm64.zip"
            "${PLUGIN_ID}_${VERSION}_windows_amd64.zip"
            "${PLUGIN_ID}_${VERSION}_windows_arm64.zip"
            "${PLUGIN_ID}_${VERSION}_freebsd_amd64.zip"
          )
          for asset in "${expected[@]}"; do
            test -f "release/${asset}" || {
              echo "missing release asset: ${asset}" >&2
              exit 1
            }
          done
          cat release/*.zip.sha256 | sort -k2 > release/checksums.txt
          (
            cd release
            sha256sum --check checksums.txt
          )
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" release/*.zip release/checksums.txt --clobber
          else
            gh release create "${tag}" release/*.zip release/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${tag}" \
              --generate-notes
          fi
